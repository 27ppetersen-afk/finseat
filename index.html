<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DeskBook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff; --bg-secondary: #f5f5f4; --bg-tertiary: #f0efed;
    --text-primary: #1c1917; --text-secondary: #57534e; --text-tertiary: #a8a29e;
    --border: rgba(28,25,23,0.12); --border-hover: rgba(28,25,23,0.25);
    --radius-md: 8px; --radius-lg: 12px;
    --blue: #185FA5; --blue-light: #E6F1FB; --blue-mid: #B5D4F4;
    --red: #E24B4A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1c1917; --bg-secondary: #292524; --bg-tertiary: #231f1e;
      --text-primary: #fafaf9; --text-secondary: #a8a29e; --text-tertiary: #57534e;
      --border: rgba(250,250,249,0.12); --border-hover: rgba(250,250,249,0.25);
    }
  }
  html, body, #root { height: 100%; }
  body { background: var(--bg-tertiary); color: var(--text-primary); }
  input[type="text"], select {
    display: block; width: 100%; padding: 8px 10px;
    border: 0.5px solid var(--border-hover); border-radius: var(--radius-md);
    background: var(--bg-primary); color: var(--text-primary);
    font-size: 14px; font-family: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,95,165,.15); }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
  #app-shell { display: flex; flex-direction: column; height: 100vh; }
  .topnav { background: var(--bg-primary); border-bottom: 0.5px solid var(--border); padding: 0 1.25rem; display: flex; align-items: center; justify-content: space-between; height: 54px; flex-shrink: 0; }
  .topnav-logo { width: 30px; height: 30px; background: var(--blue-light); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--blue); font-size: 17px; }
  .nav-btn { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: var(--bg-secondary); color: var(--text-secondary); font-size: 13px; cursor: pointer; }
  .nav-btn:hover { background: var(--bg-tertiary); }
  .nav-btn.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue-mid); }
  .nav-btn.ghost { background: none; border-color: transparent; }
  .nav-btn.ghost:hover { background: var(--bg-secondary); }
  .edit-toolbar { background: var(--blue-light); border-bottom: 0.5px solid var(--blue-mid); padding: 0 1.25rem; display: flex; align-items: center; height: 46px; gap: 0; overflow-x: auto; }
  .edit-tab { padding: 0 16px; height: 100%; background: none; border: none; border-bottom: 2px solid transparent; color: #5F5E5A; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .edit-tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }
  .edit-spacer { flex: 1; }
  .main { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .sidebar { width: 250px; flex-shrink: 0; background: var(--bg-primary); border-right: 0.5px solid var(--border); padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
  .content { flex: 1; padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav-btn { width: 26px; height: 26px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
  .cal-nav-btn:hover { background: var(--bg-secondary); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .cal-day-label { font-size: 10px; color: var(--text-tertiary); text-align: center; padding: 2px 0; }
  .cal-day { font-size: 11px; text-align: center; padding: 5px 2px; border-radius: var(--radius-md); cursor: pointer; color: var(--text-secondary); }
  .cal-day:hover { background: var(--bg-secondary); }
  .cal-day.today { color: var(--blue); font-weight: 500; }
  .cal-day.selected { background: var(--blue); color: #fff; font-weight: 500; }
  .cal-day.other { color: var(--text-tertiary); cursor: default; }
  .cal-day.other:hover { background: none; }
  .section-label { font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .booking-chip { background: var(--bg-secondary); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 7px 10px; margin-bottom: 6px; }
  .booking-chip-row { display: flex; justify-content: space-between; align-items: center; }
  .booking-chip-name { font-size: 12px; font-weight: 500; }
  .booking-chip-date { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .booking-chip-cancel { background: none; border: none; color: var(--red); font-size: 11px; cursor: pointer; padding: 0; }
  .stat-row { display: flex; gap: 8px; }
  .stat-card { border-radius: var(--radius-md); padding: 10px 14px; flex: 1; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 600; }
  .stat-lbl { font-size: 11px; margin-top: 2px; opacity: .75; }
  .info-banner { font-size: 12px; color: var(--blue); background: var(--blue-light); border: 0.5px solid var(--blue-mid); border-radius: var(--radius-md); padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
  .floor-wrap { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; flex: 1; position: relative; min-height: 400px; overflow: auto; }
  .room-chip { border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; margin-bottom: 6px; background: var(--bg-secondary); }
  .room-chip-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .room-name-input { width: 100%; font-size: 12px; padding: 3px 6px; border-radius: var(--radius-md); border: 0.5px solid var(--border); background: var(--bg-primary); color: var(--text-primary); }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-lg); }
  .modal-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; width: 300px; }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem; }
  .modal-btn-row { display: flex; gap: 8px; margin-top: 1rem; }
  .btn-primary { flex: 1; padding: 8px 16px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-primary:hover { opacity: .9; }
  .btn-primary.danger { background: var(--red); }
  .btn-secondary { padding: 8px 16px; background: var(--bg-secondary); border: 0.5px solid var(--border); border-radius: var(--radius-md); font-size: 13px; cursor: pointer; color: var(--text-secondary); }
  .auth-wrap { min-height: 100vh; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .auth-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 380px; }
  .auth-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; }
  .auth-logo-icon { width: 34px; height: 34px; background: var(--blue-light); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--blue); font-size: 19px; }
  .auth-h { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  .auth-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.5; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .auth-btn { width: 100%; padding: 10px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .auth-btn:hover { opacity: .9; }
  .auth-btn.secondary { background: var(--bg-secondary); color: var(--text-primary); border: 0.5px solid var(--border); margin-top: 8px; }
  .auth-error { font-size: 12px; color: var(--red); margin-bottom: 8px; }
  .key-box { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--blue-light); border: 0.5px solid var(--blue-mid); border-radius: var(--radius-md); margin: 8px 0 4px; }
  .key-mono { font-family: "SF Mono","Fira Code",monospace; font-size: 20px; letter-spacing: .14em; font-weight: 700; color: var(--blue); }
  .key-copy-btn { background: none; border: none; cursor: pointer; color: var(--blue); font-size: 16px; }
  .canvas-pm-btn { width: 22px; height: 22px; background: none; border: 0.5px solid var(--blue); border-radius: var(--radius-md); color: var(--blue); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .canvas-pm-btn:hover { background: var(--blue-light); }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
  @media (max-width: 680px) { .sidebar { display: none; } }
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect, useMemo } = React;

// ── constants ─────────────────────────────────────────────────────────────────
const ADMIN_KEY  = "FINTRX1";
const ADMIN_NAME = "Fintrx1";
const MONTHS     = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_LABELS = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const ROOM_TYPES = [
  {type:"meeting", label:"Meeting room", fill:"#E6F1FB", stroke:"#185FA5", text:"#0C447C"},
  {type:"office",  label:"Office",       fill:"#EEEDFE", stroke:"#534AB7", text:"#3C3489"},
  {type:"kitchen", label:"Kitchen",      fill:"#EAF3DE", stroke:"#639922", text:"#3B6D11"},
  {type:"entrance",label:"Entrance",     fill:"#F1EFE8", stroke:"#5F5E5A", text:"#444441"},
  {type:"bathroom",label:"Bathroom",     fill:"#FAEEDA", stroke:"#854F0B", text:"#633806"},
  {type:"storage", label:"Storage",      fill:"#FBEAF0", stroke:"#993556", text:"#72243E"},
];
const DEFAULT_WALL_PTS = [{x:20,y:20},{x:540,y:20},{x:540,y:320},{x:20,y:320}];
const DEFAULT_ROOMS = [
  {id:"r1",type:"kitchen", x:20, y:20, w:110,h:80, label:"Kitchen"},
  {id:"r2",type:"meeting", x:410,y:20, w:130,h:110,label:"Meeting Room"},
  {id:"r3",type:"entrance",x:220,y:280,w:100,h:40, label:"Entrance"},
];
const DW=44,DH=36;
const DEFAULT_DESKS=[
  {uid:1,label:1,x:70,y:130,w:DW,h:DH},{uid:2,label:2,x:130,y:130,w:DW,h:DH},{uid:3,label:3,x:190,y:130,w:DW,h:DH},{uid:4,label:4,x:250,y:130,w:DW,h:DH},{uid:5,label:5,x:310,y:130,w:DW,h:DH},
  {uid:6,label:6,x:70,y:190,w:DW,h:DH},{uid:7,label:7,x:130,y:190,w:DW,h:DH},{uid:8,label:8,x:190,y:190,w:DW,h:DH},{uid:9,label:9,x:250,y:190,w:DW,h:DH},{uid:10,label:10,x:310,y:190,w:DW,h:DH},
  {uid:11,label:11,x:370,y:130,w:DW,h:DH},{uid:12,label:12,x:430,y:130,w:DW,h:DH},
  {uid:13,label:13,x:370,y:190,w:DW,h:DH},{uid:14,label:14,x:430,y:190,w:DW,h:DH},
  {uid:15,label:15,x:70,y:250,w:DW,h:DH},{uid:16,label:16,x:130,y:250,w:DW,h:DH},{uid:17,label:17,x:190,y:250,w:DW,h:DH},{uid:18,label:18,x:250,y:250,w:DW,h:DH},
  {uid:19,label:19,x:370,y:250,w:DW,h:DH},{uid:20,label:20,x:430,y:250,w:DW,h:DH},
];

// ── helpers ───────────────────────────────────────────────────────────────────
function genKey(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; return Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join(""); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDate(k){ return parseKey(k).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function snap(v,g=10){ return Math.round(v/g)*g; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function midPt(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
function ptSegDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;
  if(!dx&&!dy) return Math.hypot(px-ax,py-ay);
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function relabel(desks){ return desks.map((d,i)=>({...d,label:i+1})); }
function purgePast(bookings){ const today=todayStr(); const out={}; Object.keys(bookings).forEach(dk=>{ if(dk>=today) out[dk]=bookings[dk]; }); return out; }

// ── API ───────────────────────────────────────────────────────────────────────
async function apiGet(){
  try{
    const r=await fetch("/api/state"); 
    if(!r.ok) return null;
    return await r.json();
  }catch{ return null; }
}
async function apiPost(type,data){
  try{
    await fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,data})});
  }catch(e){ console.error("apiPost failed",e); }
}

// ── drag ──────────────────────────────────────────────────────────────────────
const drag={current:null};
let rafId=null;

// ─────────────────────────────────────────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────────────────────────────────────────
function AuthScreen({onEnter}){
  const [mode,setMode]=useState("start");
  const [name,setName]=useState("");
  const [inputKey,setInputKey]=useState("");
  const [generatedKey,setGeneratedKey]=useState("");
  const [error,setError]=useState("");
  const [copied,setCopied]=useState(false);

  const handleNew=()=>{ if(!name.trim()){setError("Please enter your name.");return;} const k=genKey(); setGeneratedKey(k); setMode("showKey"); setError(""); };
  const handleReturning=()=>{
    const k=inputKey.trim().toUpperCase().replace(/\s/g,"");
    if(k.length<6){setError("Please enter your access key.");return;}
    const isAdmin=k===ADMIN_KEY;
    onEnter({name:isAdmin?ADMIN_NAME:"User",accessKey:k,isAdmin});
  };
  const copy=()=>{ navigator.clipboard?.writeText(generatedKey).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);}); };

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="auth-logo">
        <div className="auth-logo-icon"><i className="ti ti-building"/></div>
        <span style={{fontSize:18,fontWeight:700}}>DeskBook</span>
      </div>
      {mode==="start"&&<>
        <h1 className="auth-h">Welcome</h1>
        <p className="auth-sub">Book a desk for your day in the office. Each person gets a unique access key to manage their own bookings.</p>
        <button className="auth-btn" onClick={()=>{setMode("new");setError("");}}><i className="ti ti-plus" style={{marginRight:6}}/>New — get my access key</button>
        <button className="auth-btn secondary" onClick={()=>{setMode("returning");setError("");}}><i className="ti ti-key" style={{marginRight:6}}/>I have an access key</button>
      </>}
      {mode==="new"&&<>
        <h1 className="auth-h">Create access key</h1>
        <p className="auth-sub">Your key is tied to your bookings — only you can cancel them. Save it somewhere safe.</p>
        <div className="field"><label>Your name</label>
          <input type="text" value={name} onChange={e=>{setName(e.target.value);setError("");}} placeholder="e.g. Alex Chen" onKeyDown={e=>e.key==="Enter"&&handleNew()}/>
        </div>
        {error&&<p className="auth-error">{error}</p>}
        <button className="auth-btn" onClick={handleNew}>Generate my key</button>
        <button className="auth-btn secondary" onClick={()=>setMode("start")}>Back</button>
      </>}
      {mode==="showKey"&&<>
        <h1 className="auth-h">Your access key</h1>
        <p className="auth-sub">Write this down — it's the only way to sign back in and manage your bookings.</p>
        <div className="key-box">
          <span className="key-mono">{generatedKey}</span>
          <button className="key-copy-btn" onClick={copy}><i className={`ti ti-${copied?"check":"copy"}`}/></button>
        </div>
        <p style={{fontSize:11,color:"var(--text-tertiary)",marginBottom:16}}>Signed in as <strong style={{color:"var(--text-secondary)"}}>{name}</strong></p>
        <button className="auth-btn" onClick={()=>onEnter({name:name.trim(),accessKey:generatedKey,isAdmin:false})}>I've saved it — enter DeskBook</button>
      </>}
      {mode==="returning"&&<>
        <h1 className="auth-h">Enter your key</h1>
        <p className="auth-sub">Enter the access key from when you first signed up.</p>
        <div className="field"><label>Access key</label>
          <input type="text" value={inputKey} onChange={e=>{setInputKey(e.target.value.toUpperCase());setError("");}} placeholder="e.g. AB3K7X2M" onKeyDown={e=>e.key==="Enter"&&handleReturning()} style={{fontFamily:"monospace",letterSpacing:".1em"}}/>
        </div>
        {error&&<p className="auth-error">{error}</p>}
        <button className="auth-btn" onClick={handleReturning}>Sign in</button>
        <button className="auth-btn secondary" onClick={()=>setMode("start")}>Back</button>
      </>}
    </div></div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────────────────────────────────────
function App(){
  const todayRef=useRef(new Date());
  const today=todayRef.current;

  const [session,    setSession]    = useState(null);
  const [loading,    setLoading]    = useState(false);
  const [syncing,    setSyncing]    = useState(false);
  const [viewYear,   setViewYear]   = useState(()=>today.getFullYear());
  const [viewMonth,  setViewMonth]  = useState(()=>today.getMonth());
  const [selDate,    setSelDate]    = useState(()=>dateKey(today));
  const [desks,      setDesks]      = useState(DEFAULT_DESKS);
  const [rooms,      setRooms]      = useState(DEFAULT_ROOMS);
  const [wallPts,    setWallPts]    = useState(DEFAULT_WALL_PTS);
  const [bookings,   setBookings]   = useState({});
  const [canvasW,    setCanvasW]    = useState(560);
  const [canvasH,    setCanvasH]    = useState(360);
  const [nextUid,    setNextUid]    = useState(DEFAULT_DESKS.length+1);
  const [nextRoomId, setNextRoomId] = useState(DEFAULT_ROOMS.length+1);
  const [modal,      setModal]      = useState(null);
  const [editMode,   setEditMode]   = useState(false);
  const [editTab,    setEditTab]    = useState("desks");
  const [addRoomType,setAddRoomType]= useState("meeting");
  const [hovEdge,    setHovEdge]    = useState(null);
  const [copiedKey,  setCopiedKey]  = useState(false);

  const svgRef=useRef(null);
  const hovRafRef=useRef(null);
  const pollRef=useRef(null);
  const saveTimerRef=useRef(null);

  // ── load from API ─────────────────────────────────────────────────────────
  const loadState=useCallback(async(quiet=false)=>{
    if(!quiet) setLoading(true); else setSyncing(true);
    const data=await apiGet();
    if(data){
      if(data.bookings){ const clean=purgePast(data.bookings); setBookings(clean); }
      if(data.layout){
        const l=data.layout;
        if(l.desks)      setDesks(l.desks);
        if(l.rooms)      setRooms(l.rooms);
        if(l.wallPts)    setWallPts(l.wallPts);
        if(l.canvasW)    setCanvasW(l.canvasW);
        if(l.canvasH)    setCanvasH(l.canvasH);
        if(l.nextUid)    setNextUid(l.nextUid);
        if(l.nextRoomId) setNextRoomId(l.nextRoomId);
      }
    }
    setLoading(false); setSyncing(false);
  },[]);

  useEffect(()=>{
    if(!session) return;
    loadState();
    pollRef.current=setInterval(()=>loadState(true),8000);
    return ()=>clearInterval(pollRef.current);
  },[session,loadState]);

  // ── debounced layout save ─────────────────────────────────────────────────
  const schedSaveLayout=useCallback((patch)=>{
    if(saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current=setTimeout(()=>{
      // read latest from state refs to avoid stale closure
      apiPost("layout",patch);
    },600);
  },[]);

  // ── SVG coord helper ──────────────────────────────────────────────────────
  const getSVGPt=useCallback((e)=>{
    const svg=svgRef.current; if(!svg) return null;
    try{
      const pt=svg.createSVGPoint();
      const src=e.touches?e.touches[0]:e;
      pt.x=src.clientX; pt.y=src.clientY;
      const ctm=svg.getScreenCTM(); if(!ctm) return null;
      return pt.matrixTransform(ctm.inverse());
    }catch{return null;}
  },[]);

  // ── drag listeners ────────────────────────────────────────────────────────
  useEffect(()=>{
    const onMove=(e)=>{
      if(!drag.current||rafId) return;
      rafId=requestAnimationFrame(()=>{
        rafId=null; if(!drag.current) return;
        const p=getSVGPt(e); if(!p) return;
        const d=drag.current;
        if(d.kind==="desk"){ setDesks(prev=>prev.map(dk=>dk.uid===d.id?{...dk,x:clamp(snap(p.x-d.ox),25,canvasW-25),y:clamp(snap(p.y-d.oy),25,canvasH-25)}:dk)); }
        else if(d.kind==="desk-resize"){ setDesks(prev=>prev.map(dk=>dk.uid!==d.id?dk:{...dk,w:snap(Math.max(24,d.sw+(p.x-d.sx))),h:snap(Math.max(20,d.sh+(p.y-d.sy)))})); }
        else if(d.kind==="room"){ setRooms(prev=>prev.map(r=>r.id===d.id?{...r,x:clamp(snap(p.x-d.ox),10,canvasW-20),y:clamp(snap(p.y-d.oy),10,canvasH-20)}:r)); }
        else if(d.kind==="room-resize"){ setRooms(prev=>prev.map(r=>{
          if(r.id!==d.id) return r;
          let{x,y,w,h}=r;
          if(d.e==="se"){w=snap(Math.max(40,p.x-x));h=snap(Math.max(20,p.y-y));}
          if(d.e==="sw"){const nx=snap(Math.min(p.x,x+w-40));w=snap(x+w-nx);x=nx;h=snap(Math.max(20,p.y-y));}
          if(d.e==="ne"){const ny=snap(Math.min(p.y,y+h-20));h=snap(y+h-ny);y=ny;w=snap(Math.max(40,p.x-x));}
          if(d.e==="nw"){const nx=snap(Math.min(p.x,x+w-40)),ny=snap(Math.min(p.y,y+h-20));w=snap(x+w-nx);x=nx;h=snap(y+h-ny);y=ny;}
          return {...r,x,y,w,h};
        }));}
        else if(d.kind==="wall-pt"){ setWallPts(prev=>prev.map((pt,i)=>i===d.i?{x:clamp(snap(p.x),5,canvasW+15),y:clamp(snap(p.y),5,canvasH+15)}:pt)); }
      });
    };
    const onUp=()=>{ drag.current=null; if(rafId){cancelAnimationFrame(rafId);rafId=null;} };
    window.addEventListener("mousemove",onMove,{passive:true});
    window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMove,{passive:true});
    window.addEventListener("touchend",onUp);
    return()=>{ window.removeEventListener("mousemove",onMove); window.removeEventListener("mouseup",onUp); window.removeEventListener("touchmove",onMove); window.removeEventListener("touchend",onUp); if(rafId){cancelAnimationFrame(rafId);rafId=null;} };
  },[getSVGPt,canvasW,canvasH]);

  // save layout on drag end
  const onLayoutUp=useCallback(()=>{
    if(!drag.current) return;
    const k=drag.current.kind;
    if(k==="desk"||k==="desk-resize") setTimeout(()=>setDesks(prev=>{apiPost("layout",{desks:prev,rooms,wallPts,canvasW,canvasH,nextUid,nextRoomId});return prev;}),80);
    if(k==="room"||k==="room-resize") setTimeout(()=>setRooms(prev=>{apiPost("layout",{desks,rooms:prev,wallPts,canvasW,canvasH,nextUid,nextRoomId});return prev;}),80);
    if(k==="wall-pt") setTimeout(()=>setWallPts(prev=>{apiPost("layout",{desks,rooms,wallPts:prev,canvasW,canvasH,nextUid,nextRoomId});return prev;}),80);
  },[desks,rooms,wallPts,canvasW,canvasH,nextUid,nextRoomId]);
  useEffect(()=>{ window.addEventListener("mouseup",onLayoutUp); window.addEventListener("touchend",onLayoutUp); return()=>{ window.removeEventListener("mouseup",onLayoutUp); window.removeEventListener("touchend",onLayoutUp); }; },[onLayoutUp]);

  // ── desk handlers ─────────────────────────────────────────────────────────
  const onDeskDown=useCallback((e,uid)=>{ e.preventDefault(); const p=getSVGPt(e); if(!p) return; const dk=desks.find(d=>d.uid===uid); if(!dk) return; drag.current={kind:"desk",id:uid,ox:p.x-dk.x,oy:p.y-dk.y}; },[getSVGPt,desks]);
  const onDeskResizeDown=useCallback((e,uid)=>{ e.preventDefault();e.stopPropagation(); const p=getSVGPt(e); if(!p) return; const dk=desks.find(d=>d.uid===uid); if(!dk) return; drag.current={kind:"desk-resize",id:uid,sx:p.x,sy:p.y,sw:dk.w,sh:dk.h}; },[getSVGPt,desks]);

  const addDesk=useCallback(()=>{
    setNextUid(prev=>{
      const nu=prev+1;
      setDesks(d=>{ const nd=relabel([...d,{uid:prev,label:d.length+1,x:280,y:180,w:DW,h:DH}]);
        apiPost("layout",{desks:nd,rooms,wallPts,canvasW,canvasH,nextUid:nu,nextRoomId}); return nd; });
      return nu;
    });
  },[rooms,wallPts,canvasW,canvasH,nextRoomId]);

  const removeDesk=useCallback((uid)=>{
    setDesks(prev=>{ const nd=relabel(prev.filter(d=>d.uid!==uid));
      apiPost("layout",{desks:nd,rooms,wallPts,canvasW,canvasH,nextUid,nextRoomId}); return nd; });
  },[rooms,wallPts,canvasW,canvasH,nextUid,nextRoomId]);

  // ── room handlers ─────────────────────────────────────────────────────────
  const onRoomDown=useCallback((e,id)=>{ e.preventDefault(); const p=getSVGPt(e); if(!p) return; const r=rooms.find(r=>r.id===id); if(!r) return; drag.current={kind:"room",id,ox:p.x-r.x,oy:p.y-r.y}; },[getSVGPt,rooms]);
  const onResizeDown=useCallback((e,id,edge)=>{ e.preventDefault();e.stopPropagation(); drag.current={kind:"room-resize",id,e:edge}; },[]);

  const addRoom=useCallback(()=>{
    setNextRoomId(prev=>{
      const nid=prev+1;
      const rt=ROOM_TYPES.find(r=>r.type===addRoomType)||ROOM_TYPES[0];
      setRooms(r=>{ const nr=[...r,{id:"r"+prev,type:addRoomType,x:160,y:130,w:120,h:80,label:rt.label}];
        apiPost("layout",{desks,rooms:nr,wallPts,canvasW,canvasH,nextUid,nextRoomId:nid}); return nr; });
      return nid;
    });
  },[desks,wallPts,canvasW,canvasH,nextUid,addRoomType]);

  const removeRoom=useCallback((id)=>{ setRooms(prev=>{ const nr=prev.filter(r=>r.id!==id); apiPost("layout",{desks,rooms:nr,wallPts,canvasW,canvasH,nextUid,nextRoomId}); return nr; }); },[desks,wallPts,canvasW,canvasH,nextUid,nextRoomId]);
  const renameRoom=useCallback((id,label)=>{ setRooms(prev=>{ const nr=prev.map(r=>r.id===id?{...r,label}:r); apiPost("layout",{desks,rooms:nr,wallPts,canvasW,canvasH,nextUid,nextRoomId}); return nr; }); },[desks,wallPts,canvasW,canvasH,nextUid,nextRoomId]);

  // ── wall handlers ─────────────────────────────────────────────────────────
  const onWallPtDown=useCallback((e,i)=>{ e.preventDefault();e.stopPropagation(); drag.current={kind:"wall-pt",i}; },[]);
  const insertWallPt=useCallback((i)=>{ setWallPts(prev=>{ const n=prev.length,a=prev[i],b=prev[(i+1)%n],np={x:snap((a.x+b.x)/2),y:snap((a.y+b.y)/2)},next=[...prev]; next.splice(i+1,0,np); apiPost("layout",{desks,rooms,wallPts:next,canvasW,canvasH,nextUid,nextRoomId}); return next; }); setHovEdge(null); },[desks,rooms,canvasW,canvasH,nextUid,nextRoomId]);
  const removeWallPt=useCallback((i)=>{ setWallPts(prev=>{ if(prev.length<=3) return prev; const nw=prev.filter((_,j)=>j!==i); apiPost("layout",{desks,rooms,wallPts:nw,canvasW,canvasH,nextUid,nextRoomId}); return nw; }); },[desks,rooms,canvasW,canvasH,nextUid,nextRoomId]);
  const resetWalls=useCallback(()=>{ setWallPts(DEFAULT_WALL_PTS); apiPost("layout",{desks,rooms,wallPts:DEFAULT_WALL_PTS,canvasW,canvasH,nextUid,nextRoomId}); },[desks,rooms,canvasW,canvasH,nextUid,nextRoomId]);

  const setCanvasWS=useCallback(fn=>{ setCanvasW(prev=>{ const nv=fn(prev); apiPost("layout",{desks,rooms,wallPts,canvasW:nv,canvasH,nextUid,nextRoomId}); return nv; }); },[desks,rooms,wallPts,canvasH,nextUid,nextRoomId]);
  const setCanvasHS=useCallback(fn=>{ setCanvasH(prev=>{ const nv=fn(prev); apiPost("layout",{desks,rooms,wallPts,canvasW,canvasH:nv,nextUid,nextRoomId}); return nv; }); },[desks,rooms,wallPts,canvasW,nextUid,nextRoomId]);

  // ── booking handlers ──────────────────────────────────────────────────────
  const bookDesk=useCallback(async(uid)=>{
    if(!session) return;
    const fresh=await apiGet();
    const freshBk=fresh?.bookings||{};
    if(freshBk[selDate]?.[uid]){ setBookings(purgePast(freshBk)); setModal(null); return; }
    const nb={...freshBk,[selDate]:{...(freshBk[selDate]||{}),[uid]:{name:session.name,accessKey:session.accessKey}}};
    const clean=purgePast(nb);
    setBookings(clean);
    await apiPost("bookings",clean);
    setModal(null);
  },[selDate,session]);

  const cancelBooking=useCallback(async(dk,uid)=>{
    if(!session) return;
    const fresh=await apiGet();
    const freshBk=fresh?.bookings||{};
    const slot=freshBk[dk]?.[uid];
    if(slot&&slot.accessKey!==session.accessKey&&!session.isAdmin) return;
    const b={...(freshBk[dk]||{})}; delete b[uid];
    const nb=purgePast({...freshBk,[dk]:b});
    setBookings(nb);
    await apiPost("bookings",nb);
    setModal(null);
  },[session]);

  // ── calendar ──────────────────────────────────────────────────────────────
  const prevMonth=useCallback(()=>{ if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}else setViewMonth(m=>m-1); },[viewMonth]);
  const nextMonth=useCallback(()=>{ if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1);}else setViewMonth(m=>m+1); },[viewMonth]);
  const calDays=useMemo(()=>{
    const first=new Date(viewYear,viewMonth,1),startDow=first.getDay(),dim=new Date(viewYear,viewMonth+1,0).getDate(),prev=new Date(viewYear,viewMonth,0).getDate(),cells=[];
    for(let i=0;i<startDow;i++) cells.push({day:prev-startDow+1+i,other:true,dk:null});
    for(let d=1;d<=dim;d++) cells.push({day:d,other:false,dk:`${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`});
    return cells;
  },[viewYear,viewMonth]);

  // ── wall hover ────────────────────────────────────────────────────────────
  const onSVGMouseMove=useCallback((e)=>{
    if(!editMode||editTab!=="walls"||drag.current) return;
    if(hovRafRef.current) return;
    hovRafRef.current=requestAnimationFrame(()=>{
      hovRafRef.current=null;
      const p=getSVGPt(e); if(!p) return;
      const n=wallPts.length; let best=null,bestD=14;
      for(let i=0;i<n;i++){ const a=wallPts[i],b=wallPts[(i+1)%n],d=ptSegDist(p.x,p.y,a.x,a.y,b.x,b.y); if(d<bestD){bestD=d;best=i;} }
      setHovEdge(p2=>p2===best?p2:best);
    });
  },[editMode,editTab,wallPts,getSVGPt]);
  useEffect(()=>()=>{if(hovRafRef.current)cancelAnimationFrame(hovRafRef.current);},[]);

  // ── derived ───────────────────────────────────────────────────────────────
  const bk=useMemo(()=>bookings[selDate]||{},[bookings,selDate]);
  const takenCount=useMemo(()=>Object.keys(bk).length,[bk]);
  const availCount=desks.length-takenCount;
  const wallPolyline=useMemo(()=>wallPts.map(p=>p.x+","+p.y).join(" "),[wallPts]);
  const myUpcoming=useMemo(()=>{
    if(!session) return [];
    const now=new Date(); now.setHours(0,0,0,0);
    const res=[];
    Object.entries(bookings).forEach(([dk,slots])=>{ if(parseKey(dk)>=now) Object.entries(slots).forEach(([uid,slot])=>{ if(slot.accessKey===session.accessKey){ const desk=desks.find(d=>d.uid===Number(uid)); res.push({dk,uid:Number(uid),label:desk?desk.label:"?"}); } }); });
    return res.sort((a,b)=>a.dk.localeCompare(b.dk)).slice(0,8);
  },[bookings,session,desks]);

  const handleDeskClick=useCallback((uid)=>{
    if(editMode) return;
    const slot=bk[uid];
    if(!slot){setModal({uid,mode:"book"});return;}
    if(slot.accessKey===session?.accessKey){setModal({uid,mode:"mine"});return;}
    setModal({uid,mode:"locked"});
  },[editMode,bk,session]);

  const copyKey=useCallback(()=>{ navigator.clipboard?.writeText(session.accessKey).then(()=>{setCopiedKey(true);setTimeout(()=>setCopiedKey(false),2000);}); },[session]);

  // ─────────────────────────────────────────────────────────────────────────
  if(!session) return <AuthScreen onEnter={s=>setSession(s)}/>;

  if(loading) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,background:"var(--bg-tertiary)"}}>
      <div style={{width:40,height:40,background:"var(--blue-light)",borderRadius:"var(--radius-md)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--blue)",fontSize:22}}><i className="ti ti-building"/></div>
      <p style={{fontSize:14,color:"var(--text-secondary)"}}>Loading floor plan…</p>
    </div>
  );

  return(
    <div id="app-shell">
      <nav className="topnav">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="topnav-logo"><i className="ti ti-building"/></div>
          <span style={{fontSize:15,fontWeight:600}}>DeskBook</span>
          {syncing&&<span className="pulse" style={{fontSize:11,color:"var(--text-tertiary)"}}>syncing…</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 10px",background:"var(--blue-light)",border:"0.5px solid var(--blue-mid)",borderRadius:"var(--radius-md)",cursor:"pointer"}} onClick={copyKey}>
            <i className="ti ti-key" style={{fontSize:13,color:"var(--blue)"}}/>
            <span style={{fontFamily:"monospace",fontSize:13,letterSpacing:".06em",color:"var(--blue)",fontWeight:600}}>{session.accessKey}</span>
            <i className={`ti ti-${copiedKey?"check":"copy"}`} style={{fontSize:12,color:"var(--blue)"}}/>
          </div>
          {session.isAdmin&&<span style={{fontSize:11,padding:"3px 8px",background:"#FFF3C4",color:"#7A4F00",border:"0.5px solid #E6B800",borderRadius:"var(--radius-md)"}}>Admin</span>}
          <button className={`nav-btn${editMode?" active":""}`} onClick={()=>{setEditMode(e=>{if(e)setModal(null);return !e;});}}>
            <i className={`ti ti-${editMode?"check":"layout-grid-add"}`}/>{editMode?"Done":"Edit layout"}
          </button>
          <button className="nav-btn" style={{fontSize:12}} onClick={()=>loadState(true)}><i className="ti ti-refresh"/></button>
          <span style={{fontSize:13,color:"var(--text-secondary)"}}>{session.name}</span>
          <button className="nav-btn ghost" onClick={()=>setSession(null)}><i className="ti ti-logout"/></button>
        </div>
      </nav>

      {editMode&&(
        <div className="edit-toolbar">
          {[["desks","Desks"],["rooms","Rooms"],["walls","Office shape"]].map(([t,l])=>(
            <button key={t} className={`edit-tab${editTab===t?" active":""}`} onClick={()=>setEditTab(t)}>{l}</button>
          ))}
          <div className="edit-spacer"/>
          {editTab==="desks"&&<button className="nav-btn active" style={{height:30,fontSize:12}} onClick={addDesk}><i className="ti ti-plus"/> Add desk</button>}
          {editTab==="rooms"&&<div style={{display:"flex",alignItems:"center",gap:8}}>
            <select value={addRoomType} onChange={e=>setAddRoomType(e.target.value)} style={{fontSize:12,padding:"3px 8px",width:"auto"}}>
              {ROOM_TYPES.map(rt=><option key={rt.type} value={rt.type}>{rt.label}</option>)}
            </select>
            <button className="nav-btn active" style={{height:30,fontSize:12}} onClick={addRoom}><i className="ti ti-plus"/> Add room</button>
          </div>}
          {editTab==="walls"&&<div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,color:"var(--blue)",fontWeight:500}}>Canvas:</span>
            <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:11,color:"#5F5E5A"}}>W</span>
              <button className="canvas-pm-btn" onClick={()=>setCanvasWS(w=>Math.max(300,w-80))}>−</button>
              <span style={{fontSize:12,color:"var(--blue)",minWidth:36,textAlign:"center"}}>{canvasW}</span>
              <button className="canvas-pm-btn" onClick={()=>setCanvasWS(w=>Math.min(1400,w+80))}>+</button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:11,color:"#5F5E5A"}}>H</span>
              <button className="canvas-pm-btn" onClick={()=>setCanvasHS(h=>Math.max(200,h-60))}>−</button>
              <span style={{fontSize:12,color:"var(--blue)",minWidth:36,textAlign:"center"}}>{canvasH}</span>
              <button className="canvas-pm-btn" onClick={()=>setCanvasHS(h=>Math.min(1000,h+60))}>+</button>
            </div>
            <button className="nav-btn" style={{height:30,fontSize:12,color:"var(--blue)",borderColor:"var(--blue)"}} onClick={resetWalls}><i className="ti ti-refresh"/> Reset</button>
          </div>}
        </div>
      )}

      <div className="main">
        <aside className="sidebar">
          <div>
            <div className="cal-nav">
              <button className="cal-nav-btn" onClick={prevMonth}><i className="ti ti-chevron-left"/></button>
              <span style={{fontSize:13,fontWeight:500}}>{MONTHS[viewMonth]} {viewYear}</span>
              <button className="cal-nav-btn" onClick={nextMonth}><i className="ti ti-chevron-right"/></button>
            </div>
            <div className="cal-grid">
              {DAY_LABELS.map(d=><div key={d} className="cal-day-label">{d}</div>)}
              {calDays.map((cell,i)=>{
                const isToday=!cell.other&&today.getFullYear()===viewYear&&today.getMonth()===viewMonth&&today.getDate()===cell.day;
                let cls="cal-day"+(cell.other?" other":cell.dk===selDate?" selected":isToday?" today":"");
                return <div key={i} className={cls} onClick={()=>cell.dk&&setSelDate(cell.dk)}>{cell.day}</div>;
              })}
            </div>
          </div>

          {(!editMode||editTab==="desks")&&<div>
            <div className="section-label">Legend</div>
            {[["#C0DD97","Available"],["#B5D4F4","Your booking"],["#F7C1C1","Booked by others"]].map(([c,l])=>(
              <div key={l} className="legend-item"><div className="legend-dot" style={{background:c}}/>{l}</div>
            ))}
          </div>}

          {editMode&&editTab==="rooms"&&<div style={{flex:1,overflowY:"auto"}}>
            <div className="section-label">Rooms</div>
            {rooms.map(r=>{ const rt=ROOM_TYPES.find(t=>t.type===r.type)||ROOM_TYPES[0]; return(
              <div key={r.id} className="room-chip">
                <div className="room-chip-row">
                  <div style={{width:10,height:10,borderRadius:2,flexShrink:0,background:rt.fill,border:`1px solid ${rt.stroke}`}}/>
                  <span style={{fontSize:11,fontWeight:500,color:rt.text}}>{r.type}</span>
                  <button style={{marginLeft:"auto",background:"none",border:"none",color:"var(--red)",cursor:"pointer",fontSize:11}} onClick={()=>removeRoom(r.id)}>Remove</button>
                </div>
                <input className="room-name-input" value={r.label} onChange={e=>renameRoom(r.id,e.target.value)}/>
              </div>
            );})}
          </div>}

          {editMode&&editTab==="walls"&&<div style={{flex:1}}>
            <div className="section-label">How to edit</div>
            {[["ti-arrows-move","Drag a corner to reshape"],["ti-plus","Click an edge to add a point"],["ti-x","Right-click a corner to remove"],["ti-refresh","'Reset' restores rectangle"]].map(([ic,tip])=>(
              <div key={tip} style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:12,color:"var(--text-secondary)",marginBottom:8,lineHeight:1.4}}>
                <i className={`ti ${ic}`} style={{fontSize:14,marginTop:1,color:"var(--blue)"}}/>{tip}
              </div>
            ))}
          </div>}

          {!editMode&&<div style={{flex:1,overflowY:"auto"}}>
            <div className="section-label">Your upcoming bookings</div>
            {myUpcoming.length===0
              ?<div style={{fontSize:12,color:"var(--text-tertiary)",fontStyle:"italic"}}>No upcoming bookings</div>
              :myUpcoming.map(({dk,uid,label})=>(
                <div key={dk+"-"+uid} className="booking-chip">
                  <div className="booking-chip-row">
                    <span className="booking-chip-name">Desk {label}</span>
                    <button className="booking-chip-cancel" onClick={()=>cancelBooking(dk,uid)}>Cancel</button>
                  </div>
                  <div className="booking-chip-date">{fmtDate(dk)}</div>
                </div>
              ))
            }
          </div>}
        </aside>

        <section className="content">
          <h2 style={{fontSize:15,fontWeight:600}}>
            {editMode?"Edit layout — "+editTab:"Floor plan — "+fmtDate(selDate)}
          </h2>

          {!editMode&&<div className="stat-row">
            <div className="stat-card" style={{background:"#C0DD97",color:"#3B6D11"}}><div className="stat-num">{availCount}</div><div className="stat-lbl">Available</div></div>
            <div className="stat-card" style={{background:"#F7C1C1",color:"#A32D2D"}}><div className="stat-num">{takenCount}</div><div className="stat-lbl">Booked</div></div>
            <div className="stat-card" style={{background:"var(--bg-secondary)"}}><div className="stat-num">{desks.length}</div><div className="stat-lbl">Total</div></div>
          </div>}

          {editMode&&<div className="info-banner">
            <i className="ti ti-info-circle"/>
            {editTab==="desks"&&"Drag to move · Blue corner = resize · Red ✕ = remove · Changes save automatically for all users"}
            {editTab==="rooms"&&"Drag to move · Corner handles to resize · Rename in sidebar · Changes save automatically"}
            {editTab==="walls"&&"Drag corners · Click edge to add point · Right-click corner to remove · Changes save automatically"}
          </div>}

          <div className="floor-wrap">
            <svg ref={svgRef} viewBox={`0 0 ${canvasW} ${canvasH}`} width={canvasW} height={canvasH}
              style={{display:"block",userSelect:"none",minWidth:canvasW}}
              onMouseMove={onSVGMouseMove} onMouseLeave={()=>setHovEdge(null)}>

              {editMode&&editTab==="walls"&&<g opacity="0.1" style={{pointerEvents:"none"}}>
                {Array.from({length:Math.ceil(canvasW/20)+1},(_,i)=><line key={"v"+i} x1={i*20} y1={0} x2={i*20} y2={canvasH} stroke="#888" strokeWidth="0.5"/>)}
                {Array.from({length:Math.ceil(canvasH/20)+1},(_,i)=><line key={"h"+i} x1={0} y1={i*20} x2={canvasW} y2={i*20} stroke="#888" strokeWidth="0.5"/>)}
              </g>}

              <polygon points={wallPolyline} fill="#FAFAF9" stroke="none"/>

              {rooms.map(r=>{ const rt=ROOM_TYPES.find(t=>t.type===r.type)||ROOM_TYPES[0]; const isRE=editMode&&editTab==="rooms"; return(
                <g key={r.id}>
                  <rect x={r.x} y={r.y} width={r.w} height={r.h} fill={rt.fill} stroke={isRE?"#378ADD":rt.stroke} strokeWidth={isRE?1.5:0.8} rx={2} style={{cursor:isRE?"move":"default"}} onMouseDown={e=>{if(isRE)onRoomDown(e,r.id);}}/>
                  <text x={r.x+r.w/2} y={r.y+r.h/2+4} textAnchor="middle" fontSize="10" fill={rt.text} fontFamily="inherit" style={{pointerEvents:"none"}}>{r.label}</text>
                  {isRE&&[["nw",r.x,r.y],["ne",r.x+r.w,r.y],["sw",r.x,r.y+r.h],["se",r.x+r.w,r.y+r.h]].map(([e,cx,cy])=>(
                    <rect key={e} x={cx-3.5} y={cy-3.5} width={7} height={7} rx={1} fill="#fff" stroke="#378ADD" strokeWidth={1} style={{cursor:"nwse-resize"}} onMouseDown={ev=>onResizeDown(ev,r.id,e)}/>
                  ))}
                  {isRE&&<g onClick={ev=>{ev.stopPropagation();removeRoom(r.id);}} style={{cursor:"pointer"}}>
                    <circle cx={r.x+r.w} cy={r.y} r={7} fill="#E24B4A"/>
                    <text x={r.x+r.w} y={r.y+4} textAnchor="middle" fontSize="9" fill="#fff" style={{pointerEvents:"none"}}>✕</text>
                  </g>}
                </g>
              );})}

              {desks.map(desk=>{ const slot=bk[desk.uid]; const isMine=slot?.accessKey===session?.accessKey; const isTaken=!!slot&&!isMine; const isDE=editMode&&editTab==="desks";
                const fill=isDE?"#E6F1FB":isMine?"#B5D4F4":isTaken?"#F7C1C1":"#C0DD97";
                const stroke=isDE?"#378ADD":isMine?"#185FA5":isTaken?"#E24B4A":"#639922";
                const tc=isDE?"#185FA5":isMine?"#0C447C":isTaken?"#A32D2D":"#3B6D11";
                return(
                  <g key={desk.uid} style={{cursor:isDE?"grab":isTaken?"not-allowed":"pointer"}}
                    onMouseDown={e=>{if(isDE)onDeskDown(e,desk.uid);}}
                    onClick={()=>handleDeskClick(desk.uid)}>
                    <rect x={desk.x-desk.w/2} y={desk.y-desk.h/2} width={desk.w} height={desk.h} rx={5} fill={fill} stroke={stroke} strokeWidth={1}/>
                    <text x={desk.x} y={desk.y+1} textAnchor="middle" dominantBaseline="middle" fontSize={Math.max(8,Math.min(13,desk.h*0.38))} fontWeight="600" fill={tc} fontFamily="inherit">{desk.label}</text>
                    {isTaken&&!isDE&&<text x={desk.x} y={desk.y+desk.h/2-4} textAnchor="middle" fontSize="6" fill={tc} style={{pointerEvents:"none"}}>🔒</text>}
                    {isDE&&<>
                      <g onClick={e=>{e.stopPropagation();removeDesk(desk.uid);}} style={{cursor:"pointer"}}>
                        <circle cx={desk.x+desk.w/2} cy={desk.y-desk.h/2} r={7} fill="#E24B4A"/>
                        <text x={desk.x+desk.w/2} y={desk.y-desk.h/2+4} textAnchor="middle" fontSize="9" fill="#fff" style={{pointerEvents:"none"}}>✕</text>
                      </g>
                      <rect x={desk.x+desk.w/2-5} y={desk.y+desk.h/2-5} width={8} height={8} rx={1} fill="#fff" stroke="#378ADD" strokeWidth={1.5} style={{cursor:"nwse-resize"}} onMouseDown={e=>onDeskResizeDown(e,desk.uid)}/>
                    </>}
                  </g>
                );
              })}

              <polygon points={wallPolyline} fill="none" stroke={editMode&&editTab==="walls"?"#378ADD":"#5F5E5A"} strokeWidth={2} strokeLinejoin="round"/>

              {editMode&&editTab==="walls"&&wallPts.map((pt,i)=>{
                const next=wallPts[(i+1)%wallPts.length],m=midPt(pt,next),isHov=hovEdge===i;
                return <g key={"e"+i}>
                  <line x1={pt.x} y1={pt.y} x2={next.x} y2={next.y} stroke="transparent" strokeWidth={16} style={{cursor:"cell"}} onClick={()=>insertWallPt(i)}/>
                  <circle cx={m.x} cy={m.y} r={isHov?6:3.5} fill={isHov?"#185FA5":"#fff"} stroke="#378ADD" strokeWidth={1.5} style={{pointerEvents:"none"}}/>
                  {isHov&&<text x={m.x} y={m.y+4} textAnchor="middle" fontSize="9" fill="#fff" style={{pointerEvents:"none"}}>+</text>}
                </g>;
              })}

              {editMode&&editTab==="walls"&&wallPts.map((pt,i)=>(
                <g key={"pt"+i}>
                  <circle cx={pt.x} cy={pt.y} r={8} fill="#fff" stroke="#185FA5" strokeWidth={2} style={{cursor:"move"}}
                    onMouseDown={e=>onWallPtDown(e,i)} onContextMenu={e=>{e.preventDefault();removeWallPt(i);}}/>
                  <text x={pt.x} y={pt.y+4} textAnchor="middle" fontSize="8" fill="#185FA5" style={{pointerEvents:"none"}}>{i+1}</text>
                </g>
              ))}
            </svg>

            {modal&&!editMode&&(()=>{
              const slot=bk[modal.uid];
              const deskLabel=desks.find(d=>d.uid===modal.uid)?.label??modal.uid;
              const bookerName=slot?.name??"";
              return(
                <div className="modal-backdrop" onClick={()=>setModal(null)}>
                  <div className="modal-card" onClick={e=>e.stopPropagation()}>
                    {modal.mode==="book"&&<>
                      <div className="modal-title">Book Desk {deskLabel}</div>
                      <div className="modal-sub">{fmtDate(selDate)}</div>
                      <p style={{fontSize:13,color:"var(--text-secondary)"}}>This desk is available. Book it under your access key?</p>
                      <p style={{fontSize:11,color:"var(--text-tertiary)",marginTop:6}}>As <strong style={{color:"var(--text-secondary)"}}>{session.name}</strong> · <span style={{fontFamily:"monospace"}}>{session.accessKey}</span></p>
                      <div className="modal-btn-row">
                        <button className="btn-primary" onClick={()=>bookDesk(modal.uid)}>Confirm booking</button>
                        <button className="btn-secondary" onClick={()=>setModal(null)}>Cancel</button>
                      </div>
                    </>}
                    {modal.mode==="mine"&&<>
                      <div className="modal-title">Desk {deskLabel} — yours</div>
                      <div className="modal-sub">{fmtDate(selDate)}</div>
                      <p style={{fontSize:13,color:"var(--text-secondary)"}}>You have this desk booked.</p>
                      <div className="modal-btn-row">
                        <button className="btn-primary danger" onClick={()=>cancelBooking(selDate,modal.uid)}>Cancel booking</button>
                        <button className="btn-secondary" onClick={()=>setModal(null)}>Close</button>
                      </div>
                    </>}
                    {modal.mode==="locked"&&<>
                      <div className="modal-title">🔒 Desk {deskLabel} — booked</div>
                      <div className="modal-sub">{fmtDate(selDate)}</div>
                      <p style={{fontSize:13,color:"var(--text-secondary)"}}>Booked by <strong>{bookerName||"someone else"}</strong>.</p>
                      <p style={{fontSize:12,color:"var(--text-tertiary)",marginTop:6}}>Only they can cancel it. It clears automatically the following day.</p>
                      <div className="modal-btn-row"><button className="btn-secondary" style={{flex:1}} onClick={()=>setModal(null)}>Close</button></div>
                    </>}
                  </div>
                </div>
              );
            })()}
          </div>
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
